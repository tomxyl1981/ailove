<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度画像测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 600px; margin: 0 auto; }
.card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin-bottom: 20px;
}
h1 { color: #333; text-align: center; margin-bottom: 10px; font-size: 24px; }
h2 { color: #666; text-align: center; margin-bottom: 20px; font-size: 16px; font-weight: normal; }
p { color: #666; text-align: center; margin-bottom: 30px; line-height: 1.6; }
.btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: #f5576c;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}
.btn:hover { background: #e04455; }
.btn-outline {
    background: transparent;
    border: 2px solid #f5576c;
    color: #f5576c;
    margin-top: 10px;
}
.btn-outline:hover { background: #f5576c; color: white; }
.progress-bar {
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: #f5576c;
    border-radius: 4px;
    transition: width 0.3s;
}
.question { font-size: 18px; color: #333; margin-bottom: 20px; text-align: center; font-weight: 500; }
.category-label {
    display: inline-block;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 15px;
}
.option {
    display: block;
    width: 100%;
    padding: 15px;
    margin-bottom: 10px;
    background: #f8f8f8;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    transition: all 0.2s;
    font-family: inherit;
}
.option:hover { border-color: #f5576c; background: #fff5f5; }
.option.selected { background: #f5576c; color: white; border-color: #f5576c; }
.result-box {
    background: #f8f8f8;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
}
.result-title {
    font-size: 20px;
    font-weight: bold;
    color: #f5576c;
    margin-bottom: 15px;
    text-align: center;
}
.result-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}
.result-item:last-child { border-bottom: none; }
.result-label { color: #666; }
.result-value { color: #333; font-weight: 500; }
.hidden { display: none; }
.category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
}
.category-card {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
}
.category-card:hover { transform: scale(1.05); }
.category-card .icon { font-size: 30px; margin-bottom: 10px; }
.category-card .name { font-size: 14px; font-weight: bold; }
.category-card .count { font-size: 12px; opacity: 0.8; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">
    <!-- 欢迎页面 -->
    <div id="welcome" class="card">
        <h1>深度画像测试</h1>
        <h2>更深入地了解真实的你</h2>
        <p>通过5个维度、25道题目，深入了解你的性格特质、感情观、原生家庭、成长经历和心理特质。</p>
        <p style="font-size: 14px; color: #999;">选择你希望测试的模块：</p>
        
        <div class="category-grid">
            <div id="cat_personality_deep" class="category-card" onclick="startCategory('personality_deep')">
                <div class="icon">🎭</div>
                <div class="name">深度性格分析</div>
                <div class="count">5道题</div>
            </div>
            <div id="cat_relationship_view" class="category-card" onclick="startCategory('relationship_view')">
                <div class="icon">💕</div>
                <div class="name">感情观</div>
                <div class="count">5道题</div>
            </div>
            <div id="cat_family_background" class="category-card" onclick="startCategory('family_background')">
                <div class="icon">🏠</div>
                <div class="name">原生家庭</div>
                <div class="count">5道题</div>
            </div>
            <div id="cat_growth_experience" class="category-card" onclick="startCategory('growth_experience')">
                <div class="icon">🌱</div>
                <div class="name">成长经历</div>
                <div class="count">5道题</div>
            </div>
            <div id="cat_psychological_traits" class="category-card" onclick="startCategory('psychological_traits')" style="grid-column: span 2;">
                <div class="icon">🧠</div>
                <div class="name">心理特质</div>
                <div class="count">5道题</div>
            </div>
        </div>
    </div>
    
    <!-- 测试页面 -->
    <div id="quiz" class="card hidden">
        <div class="progress-bar">
            <div id="progress" class="progress-fill" style="width: 0%"></div>
        </div>
        <p style="text-align: right; color: #999; margin-bottom: 10px;">
            问题 <span id="currentNum">1</span> / <span id="totalNum">5</span>
        </p>
        <div id="categoryLabel" class="category-label"></div>
        <div id="questionText" class="question"></div>
        <div id="options"></div>
        <button id="nextBtn" class="btn" onclick="nextQuestion()" disabled>下一题</button>
    </div>
    
    <!-- 结果页面 -->
    <div id="result" class="card hidden">
        <h1>测试完成！</h1>
        <div id="resultContent" class="result-box"></div>
        <button class="btn" onclick="viewHistory()">查看结果</button>
        <button class="btn btn-outline" onclick="backToWelcome()">返回继续测试</button>
    </div>
</div>

<script>

            },
            {

                options: [
                    "运动/户外活动",

            },
            {
                question: "你最担心在感情中出现什么问题？",
                options: [
                    "被背叛或欺骗",

                    "经济或生活压力",

            {

                options: [
                    "自信和自我价值感",

};

let currentCategory = '';
let currentQuestion = 0;
let answers = {};
let completedCategories = {};

function initCompletedCategories() {
    try {
        const stored = localStorage.getItem('deep_completed');
        if (stored) {
            completedCategories = JSON.parse(stored);
        }
    } catch (e) {}
    updateCategoryButtons();
}

function saveCompletedCategories() {
    try {
        localStorage.setItem('deep_completed', JSON.stringify(completedCategories));
    } catch (e) {}
}

function updateCategoryButtons() {
    const categories = ['personality_deep', 'relationship_view', 'family_background', 'growth_experience', 'psychological_traits'];
    categories.forEach(cat => {
        const btn = document.getElementById('cat_' + cat);
        if (btn) {
            if (completedCategories[cat]) {
                btn.classList.add('completed');
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';
            }
        }
    });
}

function startCategory(category) {
    currentCategory = category;
    currentQuestion = 0;
    answers = {};
    
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    
    const data = testData[category];
    document.getElementById('categoryLabel').textContent = data.name;
    document.getElementById('totalNum').textContent = data.questions.length;
    
    showQuestion();
}

function showQuestion() {
    const data = testData[currentCategory];
    const q = data.questions[currentQuestion];
    
    document.getElementById('currentNum').textContent = currentQuestion + 1;
    document.getElementById('progress').style.width = ((currentQuestion + 1) / data.questions.length * 100) + '%';
    
    document.getElementById('questionText').textContent = q.question;
    
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = String.fromCharCode(65 + idx) + '. ' + opt;
        btn.onclick = () => selectOption(idx);
        optionsDiv.appendChild(btn);
    });
    
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtn').textContent = currentQuestion === data.questions.length - 1 ? '完成' : '下一题';
}

function selectOption(idx) {
    const options = document.querySelectorAll('.option');
    options.forEach((opt, i) => {
        opt.classList.toggle('selected', i === idx);
    });
    
    answers[currentQuestion] = String.fromCharCode(65 + idx);
    document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
    const data = testData[currentCategory];
    
    if (currentQuestion < data.questions.length - 1) {
        currentQuestion++;
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    
    const data = testData[currentCategory];
    let html = '<div class="result-title">' + data.name + '</div>';
    
    data.questions.forEach((q, idx) => {
        const answerIdx = answers[idx] ? answers[idx].charCodeAt(0) - 65 : -1;
        const answerText = answerIdx >= 0 ? q.options[answerIdx] : '未作答';
        html += '<div class="result-item">';
        html += '<span class="result-label">Q' + (idx + 1) + '：' + q.question.substring(0, 15) + '...</span>';
        html += '<span class="result-value">' + answers[idx] + '</span>';
        html += '</div>';
    });
    
    document.getElementById('resultContent').innerHTML = html;
}

function finishTest() {
    const result = {
        id: 'deep_' + Date.now(),
        timestamp: Date.now(),
        field: currentCategory,
        answers: answers
    };
    
    // Save to Android
    if (typeof Android !== 'undefined' && Android.saveResult) {
        Android.saveResult(JSON.stringify(result));
    } else {
        console.log('Deep profile result:', result);
    }
    
    // Mark this category as completed (in localStorage or JS variable)
    completedCategories[currentCategory] = true;
    saveCompletedCategories();
    
    // Don't go back automatically, show result page with buttons
    updateCategoryButtons();
}

function viewHistory() {
    // Call Android to navigate to history
    if (typeof Android !== 'undefined' && Android.showToast) {
        Android.showToast("view_deep_history");
    }
    // Also try to close the webview
    if (typeof Android !== 'undefined' && Android.closeWebView) {
        Android.closeWebView();
    }
}

function backToWelcome() {
    document.getElementById('result').classList.add('hidden');
    document.getElementById('welcome').classList.remove('hidden');
    updateCategoryButtons();
}

// Initialize on load
window.onload = initCompletedCategories;
</script>
</body>
</html>
